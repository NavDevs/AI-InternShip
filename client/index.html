<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intern-AI | Your Personal Career Assistant</title>
    <style>
      /* Inline fallback styles — visible until React mounts */
      .app-loader{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1a1a2e;flex-direction:column;gap:12px}
      .app-loader .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.15);border-top-color:#3b82f6;border-radius:50%;animation:spin .6s linear infinite}
      .app-loader p{color:#a8a29e;font-size:14px;font-family:system-ui,sans-serif}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <!-- React replaces this content when it mounts. If JS fails, the user sees the spinner instead of a white screen. -->
    <div id="root">
      <div class="app-loader">
        <div class="spinner"></div>
        <p>Loading Intern-AI…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Catch JS module load failures (stale cache, 404 assets) and force a clean reload
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('Failed to fetch dynamically imported module') || e.message.includes('Loading chunk') || e.message.includes('Loading CSS chunk'))) {
          // Clear service workers and caches, then hard reload
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
          // Reload once (use sessionStorage flag to prevent infinite loop)
          if (!sessionStorage.getItem('_reloaded')) {
            sessionStorage.setItem('_reloaded', '1');
            window.location.reload();
          }
        }
      });
      // Clear the reload flag on successful load
      window.addEventListener('load', function() {
        sessionStorage.removeItem('_reloaded');
      });
    </script>
  </body>
</html>
