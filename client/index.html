<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intern-AI | Your Personal Career Assistant</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      /* CRITICAL: Set dark background BEFORE any CSS/JS loads. 
         This prevents the "white flash" that looks like a broken page.
         React's ThemeProvider will set the real theme once mounted. */
      html, body { margin:0; background-color:#1a1a2e !important; }
      .app-loader{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1a1a2e;flex-direction:column;gap:12px}
      .app-loader .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.15);border-top-color:#3b82f6;border-radius:50%;animation:spin .6s linear infinite}
      .app-loader p{color:#a8a29e;font-size:14px;font-family:system-ui,sans-serif}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader">
        <div class="spinner"></div>
        <p>Loading Intern-AI…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clean up old service workers and caches from previous PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }
      // Auto-recover from stale JS/CSS chunks
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('Failed to fetch dynamically imported module') || e.message.includes('Loading chunk') || e.message.includes('Loading CSS chunk'))) {
          if (!sessionStorage.getItem('_reloaded')) {
            sessionStorage.setItem('_reloaded', '1');
            window.location.reload();
          }
        }
      });
      window.addEventListener('load', function() { sessionStorage.removeItem('_reloaded'); });
    </script>
  </body>
</html>
